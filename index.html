<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diff 查看器 — Myers · 折叠 · 同步滚动 · Worker</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header class="toolbar">
    <div class="brand">
      <span class="logo">⇄</span>
      <strong>Diff 查看器</strong>
    </div>
    <div class="controls">
      <button id="runBtn" class="btn primary" title="Ctrl/Cmd + Enter">比较</button>
      <button id="swapBtn" class="btn" title="交换左右内容">交换 ⇄</button>
      <button id="sampleBtn" class="btn">示例</button>
      <button id="clearBtn" class="btn">清空</button>
      <span class="sep"></span>
      <div class="fold-group" role="group" aria-label="折叠模式">
        <button id="foldAuto" class="btn fold-btn" title="只折叠较长的未更改区域">自动折叠</button>
        <button id="foldAll" class="btn fold-btn">全部折叠</button>
        <button id="foldNone" class="btn fold-btn">不折叠</button>
      </div>
    </div>
    <div id="stats" class="stats" aria-live="polite"></div>
  </header>

  <section class="inputs">
    <div class="input-pane">
      <label for="oldText">原始内容（左 / 旧）</label>
      <textarea id="oldText" spellcheck="false" placeholder="粘贴旧文本…"></textarea>
    </div>
    <div class="input-pane">
      <label for="newText">修改内容（右 / 新）</label>
      <textarea id="newText" spellcheck="false" placeholder="粘贴新文本…"></textarea>
    </div>
  </section>

  <div class="progress-track" aria-hidden="true"><div id="progress" class="progress-bar"></div></div>

  <main id="stage" class="stage">
    <div id="scroller" class="diff-scroller">
      <section class="pane" data-pane="old">
        <div class="pane-head">原文件</div>
        <div class="pane-scroll">
          <div class="row-layer"></div>
        </div>
      </section>
      <section class="pane" data-pane="new">
        <div class="pane-head">新文件</div>
        <div class="pane-scroll">
          <div class="row-layer"></div>
        </div>
      </section>
      <div id="foldLayer" class="fold-layer"></div>
    </div>
    <canvas id="minimap" class="minimap" title="点击/拖动快速定位"></canvas>
  </main>

  <footer class="statusbar">
    <span id="status">就绪</span>
    <span class="hint">Myers O(ND) 算法 · 大文件自动回退 Patience · Web Worker 计算 · IndexedDB 缓存</span>
  </footer>

  <div id="toast" class="toast-container" aria-live="assertive"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
